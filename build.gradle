buildscript {
    repositories {
        maven {
            url "https://repo1.maven.org/maven2"
        }

        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }

        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }

    dependencies {
        classpath('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') {
            changing = true
        }
    }
}

apply plugin: 'forge'
apply plugin: 'idea'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

compileJava {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

version = "11.7-UnofficalRewrite-TBEA"
group = "com.monoblocks"
archivesBaseName = "monoblocks"

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "eclipse"
}

repositories {
    maven {
        name = "ChickenBones"
        url = "http://chickenbones.net/maven/"
    }

    maven {
        url = "http://maven.cil.li/"
    }

    mavenCentral()
}

dependencies {
    compile "codechicken:CodeChickenLib:1.7.10-1.1.3.140:dev"
    compile "codechicken:CodeChickenCore:1.7.10-1.0.7.47:dev"
    compile "codechicken:ForgeMultipart:1.7.10-1.2.0.345:dev"
    compile "codechicken:ForgeMultipart:1.7.10-1.2.0.345:src"

    compile files("build/libs/foxblocks-1.5.1.jar")

    // ----------------------------
    // Unit testing
    // ----------------------------
    testCompile "junit:junit:4.13.2"
    testCompile "org.hamcrest:hamcrest-core:1.3"
}

test {
    // Keep old Gradle / ForgeGradle happy
    forkEvery = 1
    maxParallelForks = 1

    // More useful CI output
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        expand(
                'version': project.version,
                'mcversion': project.minecraft.version
        )
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}